name: Build & Release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lire VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION doit être au format X.Y.Z (lu : '$VERSION')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Décider si on publie
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "${{ steps.version.outputs.tag_exists }}" == "false" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BULLE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bulle.jks"
            echo "BULLE_KEYSTORE_PATH=$RUNNER_TEMP/bulle.jks" >> "$GITHUB_ENV"
          elif [[ "${{ steps.decide.outputs.release }}" == "true" ]]; then
            echo "::error::Secret BULLE_KEYSTORE_BASE64 manquant : impossible de publier une release signée."; exit 1
          else
            echo "::warning::Pas de keystore : build de vérification signé en debug."
          fi

      - name: Build APK release
        env:
          BULLE_KEYSTORE_PASSWORD: ${{ secrets.BULLE_KEYSTORE_PASSWORD }}
          BULLE_KEY_ALIAS: ${{ secrets.BULLE_KEY_ALIAS }}
          BULLE_KEY_PASSWORD: ${{ secrets.BULLE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Bulle-v${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Bulle-v${{ steps.version.outputs.version }}-run${{ github.run_number }}
          path: out/*.apk

      - name: Extraire le changelog
        if: steps.decide.outputs.release == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [[ -s release_notes.md ]] || echo "Version $V" > release_notes.md
          cat release_notes.md

      - name: Publier la release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bulle ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
